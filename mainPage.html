<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="css/mystyle.css">
    <meta charset="UTF-8">
    <title>李汶徽的个人网站</title>
</head>

<body>
    <nav class="nav-bar">
        <span class="nav-brand">李汶徽的个人网站</span>
        <ul class="nav-menu">
            <li class="nav-item"><a href="#home">首页</a></li>
        </ul>
    </nav>
    <div class="slider-container" id="sliderContainer">
        <div class="slider" id="slider">
            <div class="card">
                <div class="card-left">
                    <h2>网站说明</h2>
                    <p>这里用于分享一些东西。</p>
                </div>
                <div class="card-right">
                    <img src="Profile Icon.jpg" alt="预览图" class="card-image">
                </div>
            </div>
            <div class="card">
                <div class="card-left">
                    <h1>荒芜之地</h1>
                    <p>单人开发，独立完成程序、策划和美术。2.5D，动作，rougelike游戏，包含战斗和经营元素。<b>（开发中）</b></p>
                </div>
                <div class="card-right">
                    <img src="GameScene.png" alt="预览图" class="card-image">
                </div>
            </div>
            <div class="card">
                <div class="card-left">
                    <h1>灵之界</h1>
                    <p>一块多人合作开发的3D，动作，rougelike游戏。<b>（开发中）</b></p>
                </div>
                <div class="card-right">
                    <img src="Icon.png" alt="预览图" class="card-image">
                </div>
            </div>
        </div>
    </div>
    <!-- 点容器 -->
    <div class="dots" id="dots"></div>
    <script src="js/script.js"></script>
    <div class="main-content">
        <h1>欢迎来到我的个人网站！</h1>
        <div class="picture-exhibition">
            <img src="pictures/1.jpg" alt="图片1" class="exhibition-image">
            <img src="pictures/2.jpg" alt="图片2" class="exhibition-image">         
            <img src="pictures/3.jpg" alt="图片3" class="exhibition-image">
            <img src="pictures/4.jpg" alt="图片4" class="exhibition-image">
            <img src="pictures/5.jpg" alt="图片5" class="exhibition-image">
            </div>
    </div>
</body>
</html>
